<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Project Nebula</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Project Nebula</h1>
            <p>Realign your observatory credentials.</p>
        </header>

        <section class="login-box">
            <h2>Set New Password</h2>
            <form id="reset-password-form">
                <input type="password" id="new-password" placeholder="New Password" required>
                <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                <button type="submit">Update Password</button>
            </form>
            <p id="reset-msg" style="display: none; margin-top: 10px;"></p>
            <p style="margin-top: 15px; font-size: 0.9rem;"><a href="index.html" style="color: var(--accent-blue);">Back to Login</a></p>
        </section>
    </div>

    <script>
        const resetForm = document.getElementById('reset-password-form');
        const newPassword = document.getElementById('new-password');
        const confirmPassword = document.getElementById('confirm-password');
        const resetMsg = document.getElementById('reset-msg');
        
        // Ensure this matches your production API URL
        const BASE_URL = 'https://api.physicsadvisor.com/api';

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            resetMsg.style.display = 'none';

            if (newPassword.value !== confirmPassword.value) {
                resetMsg.textContent = "Passwords do not match.";
                resetMsg.style.color = "var(--danger)";
                resetMsg.style.display = 'block';
                return;
            }

            // Extract the uid and token from the URL injected by Djoser
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid');
            const token = urlParams.get('token');

            if (!uid || !token) {
                resetMsg.textContent = "Invalid or expired reset link.";
                resetMsg.style.color = "var(--danger)";
                resetMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/auth/users/reset_password_confirm/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        uid: uid,
                        token: token,
                        new_password: newPassword.value
                    })
                });

                if (response.ok) {
                    resetMsg.textContent = "Password successfully updated! You can now log in.";
                    resetMsg.style.color = "var(--accent-blue)";
                    resetForm.reset();
                } else {
                    resetMsg.textContent = "Failed to reset. The link may have expired.";
                    resetMsg.style.color = "var(--danger)";
                }
                resetMsg.style.display = 'block';
            } catch (error) {
                resetMsg.textContent = "Network error. Please try again.";
                resetMsg.style.color = "var(--danger)";
                resetMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
